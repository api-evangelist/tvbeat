problems:
  - status: 401
    title: Unauthorized
    meaning: The request was not properly signed with the TVBEAT-HMAC-SHA256 scheme.
    remediation: >-
      Recompute the canonical request, string-to-sign and signing key exactly as
      documented; confirm the x-tvbeat-date header carries the same integer UNIX
      timestamp that was used to derive the signing key.
    evidence: 'docs/api.md — "In case you fail to properly sign your request, an HTTP 401 (Unauthorized) status code will be returned with an appropriate error message."'
  - status: 403
    title: Forbidden
    meaning: >-
      The caller requested a resource — either a dataset or a dimension — that its
      access permissions do not allow.
    remediation: >-
      Query GET /{dataset}/dimensions to see the dimensions actually granted to the
      key, and use only dataset names assigned to the account.
    evidence: 'docs/api.md — "If you try to access a resource (either a dataset or a dimension) not allowed by your access permissions, an HTTP 403 (Forbidden) status code will be returned with an appropriate error message."'
  - status: 429
    title: Too Many Requests
    meaning: The concurrency limit was exceeded — more than one in-flight query per key/secret pair.
    remediation: >-
      Serialize queries per credential; wait for the in-flight query to complete
      before issuing the next one. No Retry-After header is documented.
    evidence: 'docs/api.md — "In case you exceed the rate limit, an HTTP 429 (Too Many Requests) status code will be returned with an appropriate error message."'
    detail: rate-limits/tvbeat-rate-limits.yml
