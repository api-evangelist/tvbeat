docs: https://github.com/tvbeat/public/blob/master/docs/api.md
provider: TVbeat
providerId: tvbeat
description: >-
  TVbeat publishes exactly one rate limit and it is a CONCURRENCY limit, not a
  requests-per-window limit: every key/secret combination is limited to a single
  concurrent API query. Exceeding it returns HTTP 429.
limit_count: 1
