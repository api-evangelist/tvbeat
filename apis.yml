name: TVbeat
description: TVbeat is a London-based, Techstars-backed advertising technology company
  whose platform unifies linear television and streaming (CTV) advertising operations
  into a single system. It lets media owners and buyers forecast, plan, transact,
  optimize, and measure campaigns across audiences, yield, and operations, supporting
  multi-currency transacting (ratings, spots, impressions, and outcomes) and modern
  buying models — Direct, Programmatic, Self-Serve, and AI-driven — across both traditional
  linear spots and streaming inventory. TVbeat does not publish a public API, SDK,
  or open developer portal; its documentation portal at docs.tvbeat.com is private
  and requires credentials.
