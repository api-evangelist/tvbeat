name: TVbeat
description: TVbeat is a London-based, Techstars-backed advertising technology company
  whose platform unifies linear television and streaming (CTV) advertising operations
  into a single system. It lets media owners and buyers forecast, plan, transact,
  optimize, and measure campaigns across audiences, yield, and operations, supporting
  multi-currency transacting (ratings, spots, impressions, and outcomes) and modern
  buying models — Direct, Programmatic, Self-Serve, and AI-driven — across both traditional
  linear spots and streaming inventory. TVbeat publishes a complete first-party API
  reference for its analytics API — three query endpoints signed with a custom
  TVBEAT-HMAC-SHA256 scheme, with two draft-04 JSON Schemas and example responses — in
  its own GitHub organization at github.com/tvbeat/public, but the API root it names
  (api.tvbeat.com) no longer resolves in public DNS and the document has not been
  modified since 2017. TVbeat ships no OpenAPI, SDK, CLI, MCP server or agent card, and
  its current documentation portal at docs.tvbeat.com is credential-gated.
