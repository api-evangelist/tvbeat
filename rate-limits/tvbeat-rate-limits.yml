  throttled: 429
headers:
  published: false
  note: >-
    TVbeat documents no rate-limit response headers — no X-RateLimit-*, no RateLimit-*
    (RFC 9239 style), and no Retry-After on 429. An agent gets a status code and
    nothing else, so backoff has to be blind. Recorded as a gap, not inferred.
limits:
  - name: Concurrent API queries per credential
    scope: key
    scope_detail: per access key ID / secret pair
    metric: concurrent_requests
    limit: 1
    timeFrame: concurrent
    burst: null
    window: null
    applies_to:
